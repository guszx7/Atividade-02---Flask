<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>E-commerce Flask</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><nav><a href="{{url_for('index')}}">Início</a><a href="{{url_for('usuarios_index')}}">Usuários</a><a href="{{url_for('categorias_index')}}">Categorias</a><a href="{{url_for('anuncios_index')}}">Anúncios</a><a href="{{url_for('perguntas_index')}}">Perguntas</a><a href="{{url_for('compras_index')}}">Compras</a><a href="{{url_for('favoritos_index')}}">Favoritos</a><a href="{{url_for('relatorio_vendas')}}">Vendas</a><a href="{{url_for('relatorio_compras')}}">Relatório de compras</a></nav><main>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
