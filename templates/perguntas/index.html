{% extends 'base.html' %}{% block content %}<h1>Perguntas</h1><a class="btn" href="{{url_for('pergunta_novo')}}">Nova pergunta</a><table><tr><th>ID</th><th>Pergunta</th><th>Resposta</th><th>Anúncio</th><th>Ações</th></tr>{% for p in perguntas %}<tr><td>{{p.id}}</td><td>{{p.texto}}</td><td>{{p.resposta or 'Sem resposta'}}</td><td>{{p.anuncio.titulo}}</td><td><a href="{{url_for('pergunta_editar',id=p.id)}}">Editar/Responder</a> <form class="inline" method="post" action="{{url_for('pergunta_excluir',id=p.id)}}" onsubmit="return confirm('Confirma a exclusão?')"><button>Excluir</button></form></td></tr>{% endfor %}</table>{% endblock %}
