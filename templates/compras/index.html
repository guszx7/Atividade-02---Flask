{% extends 'base.html' %}{% block content %}<h1>Compras</h1><a class="btn" href="{{url_for('compra_novo')}}">Nova compra</a><table><tr><th>ID</th><th>Data</th><th>Comprador</th><th>Anúncio</th><th>Qtd.</th><th>Valor</th><th>Ações</th></tr>{% for c in compras %}<tr><td>{{c.id}}</td><td>{{c.data.strftime('%d/%m/%Y')}}</td><td>{{c.comprador.nome}}</td><td>{{c.anuncio.titulo}}</td><td>{{c.quantidade}}</td><td>R$ {{'%.2f'|format(c.valor)}}</td><td><a href="{{url_for('compra_editar',id=c.id)}}">Editar</a> <form class="inline" method="post" action="{{url_for('compra_excluir',id=c.id)}}" onsubmit="return confirm('Confirma a exclusão?')"><button>Excluir</button></form></td></tr>{% endfor %}</table>{% endblock %}
