{% extends 'base.html' %}{% block content %}<h1>{{'Editar' if compra else 'Nova'}} compra</h1><form method="post"><input name="data" type="date" required value="{{compra.data.isoformat() if compra else ''}}"><input name="quantidade" type="number" min="1" required value="{{compra.quantidade if compra else 1}}"><select name="comprador_id" required>{% for u in usuarios %}<option value="{{u.id}}" {% if compra and compra.comprador_id==u.id %}selected{% endif %}>{{u.nome}}</option>{% endfor %}</select><select name="anuncio_id" required>{% for a in anuncios %}<option value="{{a.id}}" {% if compra and compra.anuncio_id==a.id %}selected{% endif %}>{{a.titulo}} — R$ {{'%.2f'|format(a.preco)}}</option>{% endfor %}</select><button>Salvar</button></form>{% endblock %}
