{% extends 'base.html' %}{% block content %}<h1>Favoritos</h1><a class="btn" href="{{url_for('favorito_novo')}}">Novo favorito</a><table><tr><th>Usuário</th><th>Anúncio</th><th>Ações</th></tr>{% for f in favoritos %}<tr><td>{{f.usuario.nome}}</td><td>{{f.anuncio.titulo}}</td><td><a href="{{url_for('favorito_editar',usuario_id=f.usuario_id,anuncio_id=f.anuncio_id)}}">Editar</a> <form class="inline" method="post" action="{{url_for('favorito_excluir',usuario_id=f.usuario_id,anuncio_id=f.anuncio_id)}}" onsubmit="return confirm('Confirma a exclusão?')"><button>Excluir</button></form></td></tr>{% endfor %}</table>{% endblock %}
