{% extends 'base.html' %}{% block content %}<h1>{{'Editar' if usuario else 'Novo'}} usuário</h1><form method="post"><input name="nome" placeholder="Nome" required value="{{usuario.nome if usuario else ''}}"><input name="email" type="email" placeholder="E-mail" required value="{{usuario.email if usuario else ''}}"><input name="senha" type="password" placeholder="Senha" required value="{{usuario.senha if usuario else ''}}"><button>Salvar</button></form>{% endblock %}
