{% extends 'base.html' %}{% block content %}<h1>Categorias</h1><a class="btn" href="{{url_for('categoria_novo')}}">Nova categoria</a><table><tr><th>ID</th><th>Nome</th><th>Ações</th></tr>{% for c in categorias %}<tr><td>{{c.id}}</td><td>{{c.nome}}</td><td><a href="{{url_for('categoria_editar',id=c.id)}}">Editar</a> <form class="inline" method="post" action="{{url_for('categoria_excluir',id=c.id)}}" onsubmit="return confirm('Confirma a exclusão?')"><button>Excluir</button></form></td></tr>{% endfor %}</table>{% endblock %}
