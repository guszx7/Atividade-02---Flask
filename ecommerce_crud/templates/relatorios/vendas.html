{% extends 'base.html' %}{% block content %}<h1>Relatório de vendas</h1><table><tr><th>Data</th><th>Anúncio</th><th>Comprador</th><th>Quantidade</th><th>Valor</th></tr>{% for c in vendas %}<tr><td>{{c.data.strftime('%d/%m/%Y')}}</td><td>{{c.anuncio.titulo}}</td><td>{{c.comprador.nome}}</td><td>{{c.quantidade}}</td><td>R$ {{'%.2f'|format(c.valor)}}</td></tr>{% endfor %}</table>{% endblock %}
