{% extends 'base.html' %}{% block content %}<h1>Usuários</h1><a class="btn" href="{{url_for('usuario_novo')}}">Novo usuário</a><table><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Ações</th></tr>{% for u in usuarios %}<tr><td>{{u.id}}</td><td>{{u.nome}}</td><td>{{u.email}}</td><td><a href="{{url_for('usuario_editar',id=u.id)}}">Editar</a> <form class="inline" method="post" action="{{url_for('usuario_excluir',id=u.id)}}" onsubmit="return confirm('Confirma a exclusão?')"><button>Excluir</button></form></td></tr>{% endfor %}</table>{% endblock %}
