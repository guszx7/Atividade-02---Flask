{% extends 'base.html' %}{% block content %}<h1>{{'Editar/Responder' if pergunta else 'Nova'}} pergunta</h1><form method="post"><textarea name="texto" required placeholder="Pergunta">{{pergunta.texto if pergunta else ''}}</textarea><textarea name="resposta" placeholder="Resposta do proprietário">{{pergunta.resposta if pergunta else ''}}</textarea><select name="usuario_id" required>{% for u in usuarios %}<option value="{{u.id}}" {% if pergunta and pergunta.usuario_id==u.id %}selected{% endif %}>{{u.nome}}</option>{% endfor %}</select><select name="anuncio_id" required>{% for a in anuncios %}<option value="{{a.id}}" {% if pergunta and pergunta.anuncio_id==a.id %}selected{% endif %}>{{a.titulo}}</option>{% endfor %}</select><button>Salvar</button></form>{% endblock %}
