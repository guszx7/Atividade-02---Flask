{% extends 'base.html' %}{% block content %}<h1>{{'Editar' if anuncio else 'Novo'}} anúncio</h1><form method="post"><input name="titulo" placeholder="Título" required value="{{anuncio.titulo if anuncio else ''}}"><textarea name="descricao" placeholder="Descrição" required>{{anuncio.descricao if anuncio else ''}}</textarea><input name="preco" type="number" step="0.01" required value="{{anuncio.preco if anuncio else ''}}"><select name="usuario_id" required>{% for u in usuarios %}<option value="{{u.id}}" {% if anuncio and anuncio.usuario_id==u.id %}selected{% endif %}>{{u.nome}}</option>{% endfor %}</select><select name="categoria_id" required>{% for c in categorias %}<option value="{{c.id}}" {% if anuncio and anuncio.categoria_id==c.id %}selected{% endif %}>{{c.nome}}</option>{% endfor %}</select><button>Salvar</button></form>{% endblock %}
