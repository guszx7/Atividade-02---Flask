{% extends 'base.html' %}{% block content %}<h1>Anúncios</h1><a class="btn" href="{{url_for('anuncio_novo')}}">Novo anúncio</a><table><tr><th>ID</th><th>Título</th><th>Preço</th><th>Usuário</th><th>Categoria</th><th>Ações</th></tr>{% for a in anuncios %}<tr><td>{{a.id}}</td><td><a href="{{url_for('anuncio_detalhe',id=a.id)}}">{{a.titulo}}</a></td><td>R$ {{'%.2f'|format(a.preco)}}</td><td>{{a.usuario.nome}}</td><td>{{a.categoria.nome}}</td><td><a href="{{url_for('anuncio_editar',id=a.id)}}">Editar</a> <form class="inline" method="post" action="{{url_for('anuncio_excluir',id=a.id)}}" onsubmit="return confirm('Confirma a exclusão?')"><button>Excluir</button></form></td></tr>{% endfor %}</table>{% endblock %}
