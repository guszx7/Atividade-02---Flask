{% extends 'base.html' %}{% block content %}<h1>{{'Editar' if favorito else 'Novo'}} favorito</h1><form method="post"><select name="usuario_id" required>{% for u in usuarios %}<option value="{{u.id}}" {% if favorito and favorito.usuario_id==u.id %}selected{% endif %}>{{u.nome}}</option>{% endfor %}</select><select name="anuncio_id" required>{% for a in anuncios %}<option value="{{a.id}}" {% if favorito and favorito.anuncio_id==a.id %}selected{% endif %}>{{a.titulo}}</option>{% endfor %}</select><button>Salvar</button></form>{% endblock %}
